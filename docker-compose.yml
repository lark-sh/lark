# Single-host Lark stack.
#
# Brings up lark-edge (Go: admin dashboard + wire-protocol proxy) and
# lark-server (Rust: DB engine), both COMPILED FROM THE WORKING TREE. Plain
# HTTP throughout — browsers exempt *.localhost from mixed-content rules, so
# this works for local dev without TLS gymnastics.
#
# State lands in `./lark-data-dev` (git-ignored): `server/` for the WAL + blob
# files, `edge/` for the SQLite control plane. Being on the host filesystem
# means host tooling — lark-compact, a hex dump, checking the WAL is valid
# JSONL — can read it without reaching into a container. `rm -rf lark-data-dev`
# resets the stack. The path deliberately differs from the `./lark-data` that
# docker-compose.prod.yml uses, so a source build and a published release image
# never share a data directory.
#
# Usage (from the repo root):
#
#   make up
#   # or:
#   docker compose up --build
#
# On first boot, lark-edge prints the temp admin password to its logs.
# Browse to http://localhost:8080/admin/ and change it.

services:
  lark-edge:
    build:
      context: .
      dockerfile: edge/Dockerfile
    image: lark-edge:dev
    container_name: lark-edge
    ports:
      - "8080:8080"
    environment:
      DISABLE_TLS: "true"
      HTTPS_LISTEN_ADDR: ":8080"
      # Internal HTTP listener (server-to-server: /internal/register,
      # /internal/metrics). Kept on a separate port from the main HTTP
      # listener and not published to the host — only reachable from
      # within the docker network.
      INTERNAL_LISTEN_ADDR: ":8081"
      # Single hostname; lark-edge routes by Host header against this.
      # Browsers resolve *.localhost (including multi-level like
      # *.lark.localhost) to loopback per RFC 6761 — no /etc/hosts needed.
      # We use a two-part TLD here to better simulate how it works in a deployment
      # scenario (e.g. project-id.yourdomain.com)
      LARKDB_DOMAIN: "lark.localhost"
      # SQLite is the default driver
      DATABASE_URL: "sqlite:///data/lark.db"
      # Bring up the dashboard + admin API + first-boot bootstrap.
      ADMIN_API_ENABLED: "true"
      # Shared secret for backend (lark-server) auth. Change this in
      # any non-throwaway deploy.
      SERVER_SECRET: "${SERVER_SECRET:-dev-secret-change-me}"
    volumes:
      - ./lark-data-dev/edge:/data
    networks:
      - lark

  lark-server:
    build:
      # Repo root is the build context; the Dockerfile pulls in
      # both `server/` and `blob/` from the workspace.
      context: .
      dockerfile: server/Dockerfile
    image: lark-server:dev
    container_name: lark-server
    environment:
      LARK_SERVER_ID: "lark-server-1"
      LARK_HOSTNAME: "lark-server"
      LARK_PUBLIC_IP: "lark-server"
      LARK_PRIVATE_IP: "lark-server"
      LARK_PROXY_PORT: "2727"
      LARK_DATA_DIR: "/data"
      # Registers with lark-edge's internal HTTP listener so the
      # discovery loop on the other side learns about us.
      LARK_COORDINATOR_URL: "http://lark-edge:8081"
      # Push per-database metrics straight to lark-edge so the dashboard's
      # Monitoring tab works out of the box — no external log shipper needed.
      LARK_METRICS_PUSH: "true"
      # Shared secret authenticating the edge↔server proxy channel. MUST match
      # lark-edge's SERVER_SECRET — the server rejects gateways that can't prove it.
      SERVER_SECRET: "${SERVER_SECRET:-dev-secret-change-me}"
    volumes:
      - ./lark-data-dev/server:/data
    # Glommio's io_uring needs the seccomp profile relaxed; this also
    # lets the kernel set CPU affinity on the worker threads.
    security_opt:
      - seccomp:unconfined
    networks:
      - lark

networks:
  lark:
    driver: bridge
