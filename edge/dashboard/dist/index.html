<!doctype html>
<!--
  Placeholder for the Lark admin dashboard.

  This file is committed so the Go build's `//go:embed all:dist`
  (edge/dashboard/embed.go) always has something to compile against, even on a
  fresh clone where the SPA hasn't been built. The real, production dashboard
  bundle is produced by Vite and overwrites this directory:

      make build-spa            # from the repo root
      # or:
      cd edge/dashboard && npm ci && npm run build

  `make up` / `make build-edge` run that build for you. If you're seeing this
  page in a running lark-edge, the dashboard wasn't built before the binary was
  compiled.
-->
