## CLA enforcement via contributor-assistant/github-action.
##
## On every PR, this posts a status check requiring the author to sign the
## Individual CLA by commenting the sign statement below. Signatures are recorded
## in a JSON file in this repo (signatures/version1/cla.json).
##

name: CLA Assistant
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA check
        # Only run on PR comments, not issue comments.
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          path-to-document: 'https://github.com/lark-sh/lark/blob/main/docs/cla/individual-cla.md'
          branch: 'main'
          allowlist: 'dependabot[bot],github-actions[bot]'
          custom-notsigned-prcomment: 'Thanks for your pull request! Before we can merge it, please sign our [Individual Contributor License Agreement](https://github.com/lark-sh/lark/blob/main/docs/cla/individual-cla.md). You can sign by posting the comment below in this PR.'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: '✅ All contributors have signed the CLA.'
