name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust — fmt, clippy, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GitHub's Linux runners have io_uring, so the Rust workspace builds
      # natively (no dev container needed). These mirror Dockerfile.dev's deps.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev liburing-dev clang mold

      # Pinned to match rust-toolchain.toml + Dockerfile.dev (bump all three together).
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The steps below mirror `make fmt` / `make lint` / `make check` / `make test`.
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test (lib)
        run: cargo test --workspace --lib

      # integration_compact shells out to the lark-compact binary; the Build
      # step above already produced it (it's a workspace member). The slow
      # `#[ignore]` storage-worker tests stay out of PR CI — `make test-all`
      # runs them.
      - name: Test (integration)
        run: cargo test --workspace --tests

  go:
    name: Go edge — fmt, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: edge/go.mod
          cache-dependency-path: edge/go.sum

      # Mirrors `make fmt` (go fmt ./...). gofmt -l lists files that aren't
      # formatted without rewriting them; any output means the diff would be
      # non-empty, so fail the job.
      - name: Format check
        working-directory: edge
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted (run 'make fmt'):"
            echo "$unformatted"
            exit 1
          fi

      # Note: edge/dashboard/embed.go does `//go:embed all:dist`; the committed
      # placeholder edge/dashboard/dist/index.html satisfies it without a full
      # SPA build. (`make build-edge` builds the real dashboard.)
      - name: Vet
        working-directory: edge
        run: go vet ./...

      - name: Test
        working-directory: edge
        run: go test ./...
