name: Feature request
description: Suggest an idea or enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or pain point, not just the proposed solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Lark to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you've thought about.
  - type: dropdown
    id: firebase
    attributes:
      label: Is this about Firebase compatibility?
      description: Lark aims to be wire-compatible with the Firebase Realtime Database.
      options:
        - "No"
        - "Yes — Firebase has this and Lark doesn't match"
    validations:
      required: true
