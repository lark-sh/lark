name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! For **security** issues, do not file here — see
        [SECURITY.md](https://github.com/lark-sh/lark/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, config, or a code snippet that triggers the bug.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - lark-server (Rust engine)
        - lark-edge (Go gateway)
        - lark-blob (storage format)
        - deployment / docker / fly
        - other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Release tag or git commit SHA.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, kernel (for lark-server / io_uring), Docker vs native, etc.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any relevant log output (set `RUST_LOG=debug` for more detail).
      render: shell
