# Weekly dependency updates. Minor and patch bumps for each ecosystem land as
# one grouped PR; major bumps get their own PR, since they can need code
# changes. CI (ci.yml) builds and tests every ecosystem listed here.
#
# Docker base images and the Rust toolchain are pinned by hand (see the
# comments in ci.yml and the Dockerfiles) and aren't listed.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /edge
    schedule:
      interval: weekly
    groups:
      go:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - /edge/dashboard
      - /examples/sticky-notes
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
