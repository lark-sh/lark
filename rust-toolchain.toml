# Pinned toolchain so rustfmt and clippy behave identically across local dev, the
# Makefile dev container, and CI — otherwise a new `stable` silently changes
# formatting / adds lints and turns CI red (which is exactly what happened).
#
# Bump deliberately, and keep these in sync when you do:
#   - CI:            .github/workflows/ci.yml  (dtolnay/rust-toolchain@<version>)
#   - Nightly:       .github/workflows/nightly.yml  (same)
#   - Dev container: Dockerfile.dev            (--default-toolchain <version>)
# server/Dockerfile reads this file directly, so it needs no change.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
