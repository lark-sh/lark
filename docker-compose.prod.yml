# Single-host Lark stack running PREBUILT images from GHCR.
#
# Same topology as docker-compose.yml, but instead of compiling from source it
# pulls published `lark-server` / `lark-edge` images — so you get a running
# stack in seconds without a Rust/Go toolchain. This is the fast "try it" path.
#
# You do NOT need a clone of the Lark repo to use this file. Download it on its
# own, give it a secret, and start:
#
#   mkdir lark && cd lark
#   curl -fsSL https://raw.githubusercontent.com/lark-sh/lark/main/docker-compose.prod.yml -o docker-compose.yml
#   echo "SERVER_SECRET=$(openssl rand -hex 32)" > .env
#   docker compose up
#
# Compose reads `.env` from the working directory, so that is the whole setup.
# Saving the file as `docker-compose.yml` keeps every later command bare
# (`docker compose down`, `docker compose pull`, and so on).
#
# All state lands in `./lark-data` next to this file — `server/` holds the
# databases (blob + WAL) and `edge/` holds the control plane (projects, admin
# users, routing). Back up that one directory and you have everything; you need
# both halves for a restore to work. It also means a stack in another directory
# is a separate deployment with its own data.
#
# The images track `latest` by default; pin a version in the same .env:
#
#   echo "LARK_VERSION=0.2.0" >> .env
#
# From a repo clone, `make up-release` generates the .env for you and runs this
# file directly.
#
# Note: this serves plain HTTP on localhost (browsers exempt *.localhost from
# mixed-content rules), which is right for trying Lark on your machine. For a
# real internet-facing deployment with TLS, see deploy/fly/.

# Pinned so container and network names stay stable wherever the file is saved;
# without it Compose derives the project name from the parent directory.
name: lark

services:
  lark-edge:
    image: ghcr.io/lark-sh/lark-edge:${LARK_VERSION:-latest}
    container_name: lark-edge
    ports:
      - "8080:8080"
    environment:
      DISABLE_TLS: "true"
      HTTPS_LISTEN_ADDR: ":8080"
      INTERNAL_LISTEN_ADDR: ":8081"
      LARKDB_DOMAIN: "lark.localhost"
      DATABASE_URL: "sqlite:///data/lark.db"
      ADMIN_API_ENABLED: "true"
      SERVER_SECRET: "${SERVER_SECRET:?required — add SERVER_SECRET=<32+ byte random value> to a .env file beside this compose file; 'openssl rand -hex 32' generates one}"
    volumes:
      - ./lark-data/edge:/data
    networks:
      - lark

  lark-server:
    image: ghcr.io/lark-sh/lark-server:${LARK_VERSION:-latest}
    container_name: lark-server
    environment:
      LARK_SERVER_ID: "lark-server-1"
      LARK_HOSTNAME: "lark-server"
      LARK_PUBLIC_IP: "lark-server"
      LARK_PRIVATE_IP: "lark-server"
      LARK_PROXY_PORT: "2727"
      LARK_DATA_DIR: "/data"
      LARK_COORDINATOR_URL: "http://lark-edge:8081"
      LARK_METRICS_PUSH: "true"
      # WAL durability — defaults shown (see docs/DEPLOYMENT.md#durability).
      # For strict per-write durability: "0" + "true".
      LARK_WAL_SYNC_INTERVAL_MS: "2000"
      LARK_FSYNC_ON_WAL_FLUSH: "false"
      SERVER_SECRET: "${SERVER_SECRET:?required — add SERVER_SECRET=<32+ byte random value> to a .env file beside this compose file; 'openssl rand -hex 32' generates one}"
    volumes:
      - ./lark-data/server:/data
    # Glommio's io_uring needs the seccomp profile relaxed; this also
    # lets the kernel set CPU affinity on the worker threads.
    security_opt:
      - seccomp:unconfined
    networks:
      - lark

networks:
  lark:
    driver: bridge
