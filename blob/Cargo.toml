[package]
name = "lark-blob"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-blob storage engine for the Lark database."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh64"] }
thiserror = "2"
tracing = "0.1"
libc = "0.2"
lru = "0.18"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
futures = "0.3"

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "promotion"
harness = false

[[bin]]
name = "inspect"
path = "src/bin/inspect.rs"
